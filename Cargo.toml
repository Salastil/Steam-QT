[workspace]
resolver = "3"
members = ["crates/core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Salastil/Steam-QT"

[workspace.dependencies]
steamqt-core = { path = "crates/core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.dev]
# Full debug info for Qt/cxx bindings makes target/ very large; line tables keep backtraces.
debug = "line-tables-only"
