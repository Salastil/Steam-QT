[package]
name = "steam-qt"
description = "Lightweight Steam library client for Linux (Qt/KDE)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "steam-qt"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
steamqt-core.workspace = true
tokio.workspace = true
tokio-util = "0.7.20"
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.8"

[build-dependencies]
cxx-qt-build = "0.10"
